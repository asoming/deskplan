name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful four-platform build run ID
        required: true
        type: string
      version:
        description: Release version
        required: true
        default: '1.0.2'
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_RUN: ${{ inputs.build_run }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify source build
        run: |
          gh run view "$VERIFIED_RUN" --json headSha,status,conclusion,url,jobs > workflow.json
          python3 - <<'PY'
          import json,os,re,subprocess
          r=json.load(open('workflow.json'))
          assert re.fullmatch(r'\d+\.\d+\.\d+',os.environ['VERSION'])
          assert r['status']=='completed' and r['conclusion']=='success'
          assert len(r['jobs'])==4 and all(j['conclusion']=='success' for j in r['jobs'])
          assert r['headSha']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          meta=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/actions/runs/{os.environ['VERIFIED_RUN']}"]))
          assert meta['path']=='.github/workflows/build.yml'
          assert json.load(open('package.json'))['version']==os.environ['VERSION']
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('VERIFIED_SHA='+r['headSha']+'\n')
          PY
      - name: Download verified artifacts
        run: |
          gh run download "$VERIFIED_RUN" --pattern 'release-*' --dir artifacts
          gh run download "$VERIFIED_RUN" --pattern 'tests-*' --dir evidence
      - name: Prepare checksums and evidence
        run: |
          python3 - <<'PY'
          import pathlib,shutil,json,hashlib,zipfile,os
          version=os.environ['VERSION'];out=pathlib.Path('release');out.mkdir()
          files=list(pathlib.Path('artifacts').glob('release-*/*'))
          suffixes=['linux-x64.deb','linux-x64.tar.gz','windows-x64-setup.exe','mac-arm64.dmg','mac-arm64.zip','mac-x64.dmg','mac-x64.zip']
          assert len(files)==7 and {p.name for p in files}=={f'Rixu-{version}-{s}' for s in suffixes}
          checks=[]
          for p in sorted(files,key=lambda p:p.name):
              assert p.is_file() and p.stat().st_size>10_000_000
              checks.append(hashlib.file_digest(p.open('rb'),'sha256').hexdigest()+'  '+p.name)
              shutil.copy2(p,out/p.name)
          (out/'SHA256SUMS.txt').write_text('\n'.join(checks)+'\n')
          reports=list(pathlib.Path('evidence').glob('tests-*/*.json'))
          assert len(reports)==20
          for p in reports:
              report=json.loads(p.read_text());assert report['passed'] is True
              if 'sandbox' in report:assert report['sandbox'] is True
          with zipfile.ZipFile(out/f'Rixu-{version}-test-reports.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write('workflow.json','workflow.json')
              for p in sorted(reports):z.write(p,p.relative_to('evidence'))
          r=json.load(open('workflow.json'))
          lines=[f'# Rixu {version} / 日序发行验证', '', f'Commit: `{r["headSha"]}`', '', f'[Four-platform validation]({r["url"]})', '', 'All four platform jobs passed. Includes native language switching and packaged/installed process restart tests with the sandbox enabled.', '', '四个平台均通过，包含应用内语言切换、任务与草稿保留、打包与安装后重启测试。', '', 'Windows is unsigned; macOS is ad-hoc signed and not notarized. OS-native controls may follow the system language.']
          (out/'RELEASE-VERIFICATION.md').write_text('\n'.join(lines)+'\n')
          shutil.copy2('docs/PRD.zh-CN.md',out/f'Rixu-{version}-PRD.zh-CN.md')
          PY
      - name: Publish release
        run: |
          gh release create "v$VERSION" release/* --target "$VERIFIED_SHA" --title "日序 · Rixu $VERSION" --notes-file "docs/releases/$VERSION.md" --latest
          gh release view "v$VERSION" --json url,isDraft,isPrerelease,assets > published.json
          python3 - <<'PY'
          import json
          r=json.load(open('published.json'))
          assert not r['isDraft'] and not r['isPrerelease']
          assert len(r['assets'])==11
          print(r['url'])
          PY
